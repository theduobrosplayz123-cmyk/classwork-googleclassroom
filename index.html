<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyber OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Lock screen (click or press a key to continue) -->
  <div id="lock" tabindex="0" aria-label="Lock screen. Click or press any key to sign in.">
    <div class="lock-clock"><div id="lock-time">--:--</div><div id="lock-date"></div></div>
    <div class="lock-status" aria-hidden="true"><span>🔋</span><span>📶</span><span>💬</span></div>
    <div class="lock-hint">Click or press any key to unlock</div>
  </div>

  <!-- Password screen -->
  <div id="login" hidden>
    <form id="login-form" class="login-box" autocomplete="off">
      <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c1.2-4.2 4.6-6.5 8.5-6.5s7.3 2.3 8.5 6.5"/></svg></div>
      <div class="login-name">Cyber User</div>
      <div class="pw-row"><input id="pw" type="password" inputmode="numeric" placeholder="Password" aria-label="Password" /><button type="submit" aria-label="Sign in">→</button></div>
      <div id="pw-msg" role="alert"></div>
    </form>
    <div class="login-hint">Password: <b>1234</b></div>
    <div class="login-icons"><span aria-hidden="true">🖧</span><span aria-hidden="true">◔</span><button type="button" id="login-back" title="Back to lock screen">⏻</button></div>
  </div>

  <!-- Desktop -->
  <main id="desktop" aria-label="Desktop">
    <div id="icons"></div>
    <div id="windows"></div>
  </main>

  <!-- Start menu -->
  <div id="start-menu" hidden>
    <div class="sm-head">CYBER<span>OS</span></div>
    <input id="sm-search" placeholder="Search apps or the web…" />
    <div id="sm-apps"></div>
    <div class="sm-foot"><button id="sm-power">⏻ Restart</button></div>
  </div>

  <!-- Taskbar -->
  <footer id="taskbar">
    <button id="start-btn" title="Start"><span class="logo-mark">◢◣</span></button>
    <form id="tb-search"><span>⌕</span><input placeholder="Search DuckDuckGo" /></form>
    <div id="tb-apps"></div>
    <div class="tb-right">
      <button id="weather-chip" title="Weather">☁ <span id="chip-temp">--°</span></button>
      <div id="tb-clock"><span id="clock-time"></span><span id="clock-date"></span></div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
